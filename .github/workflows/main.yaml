name: main
on:
  push:
    branches:
    - master
    tags:
    - "*"
  pull_request:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - uses: pre-commit/action@v3.0.0
  test:
    name: test
    runs-on: ubuntu-latest
    container: golang:1.27-alpine3.24
    steps:
    - name: Install git
      run: apk add --update --no-cache git
    - name: Checkout code
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0
    - name: Test
      run: |
        scripts/alpine-setup.sh
        make test
  build:
    name: build
    runs-on: ubuntu-latest
    container: golang:1.27-alpine3.24
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [arm64, amd64]
        exclude:
          - os: windows
            arch: arm64
    steps:
      - name: Install git
        run: apk add --update --no-cache git
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Build
        run: |
          git config --global --add safe.directory /__w/kube-no-trouble/kube-no-trouble
          scripts/alpine-setup.sh
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} make all
        shell: sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package (.deb / .zip)
        if: matrix.os != 'darwin'
        run: |
          GIT_REF=$(echo "${GITHUB_REF}" | sed "s,refs/[^/]*/,," | tr -cd '[:alnum:]._-')
          scripts/package.sh ${{ matrix.os }} ${{ matrix.arch }} \
            bin/kubent-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} "${GIT_REF}"
        shell: sh
      - name: Archive release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts
  build-macos-pkg:
    name: build macOS pkg
    needs:
      [build]
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts-darwin-${{ matrix.arch }}
          path: darwin
      - name: Package (.pkg)
        run: |
          GIT_REF=$(echo "${GITHUB_REF}" | sed "s,refs/[^/]*/,," | tr -cd '[:alnum:]._-')
          tar -xzf darwin/kubent-*-darwin-${{ matrix.arch }}.tar.gz -C darwin
          scripts/package.sh darwin ${{ matrix.arch }} darwin/kubent "${GIT_REF}" release-artifacts
      - name: Archive release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-macos-pkg-${{ matrix.arch }}
          path: release-artifacts
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: |
            linux/arm64
            linux/amd64
          build-args: |
            GITHUB_REF
            GITHUB_SHA
          cache-from: type=gha
          cache-to: type=gha
  integration-test:
    name: integration test
    needs:
      [pre-commit, build, build-docker, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # each node image needs a kind release that supports it
        include:
          - { k8s_version: "kindest/node:v1.19.16", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.20.15", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.21.14", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.22.17", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.23.17", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.24.17", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.25.16", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.26.14", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.27.11", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.28.7", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.29.2", kind_version: "v0.26.0" }
          - { k8s_version: "kindest/node:v1.30.13", kind_version: "v0.29.0" }
          - { k8s_version: "kindest/node:v1.31.14", kind_version: "v0.31.0" }
          - { k8s_version: "kindest/node:v1.32.11", kind_version: "v0.31.0" }
          - { k8s_version: "kindest/node:v1.33.12", kind_version: "v0.32.0" }
          - { k8s_version: "kindest/node:v1.34.11", kind_version: "v0.33.0" }
          - { k8s_version: "kindest/node:v1.35.8", kind_version: "v0.33.0" }
          - { k8s_version: "kindest/node:v1.36.4", kind_version: "v0.33.0" }
          - { k8s_version: "kindest/node:v1.37.0", kind_version: "v0.33.0" }
    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: release-artifacts-linux-amd64
        path: release-artifacts
    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.15.1
      with:
        version: ${{ matrix.kind_version }}
        node_image: ${{ matrix.k8s_version }}
        cluster_name: kubent-test-cluster
    - name: run integration test
      run: |
        tar xvzf release-artifacts/kubent-*-linux-amd64.tar.gz
        kubectl version
        kubectl cluster-info --context kind-kubent-test-cluster
        ./kubent
  create-release:
    name: Create Release
    needs:
      [integration-test, build-macos-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_name: ${{ steps.get_tag.outputs.git_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --latest
        env:
          OUTPUT: changelog.md
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts-linux-amd64
          path: release-artifacts
      - name: Get the tag
        id: get_tag
        run: echo "git_tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_tag.outputs.git_tag }}
          release_name: ${{ steps.get_tag.outputs.git_tag }}
          body_path: ${{ steps.git-cliff.outputs.changelog }}
          draft: ${{ startsWith(steps.get_tag.outputs.git_tag, 'nightly') != true }}
          prerelease: ${{ startsWith(steps.get_tag.outputs.git_tag, 'nightly') }}
  push-image:
    name: Push Image
    needs:
      [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: |
            linux/arm64
            linux/amd64
          tags: |
            ${{ format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, needs.create-release.outputs.tag_name) }}
            ${{ ( !startsWith(github.ref, 'refs/tags/nightly') && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, 'latest') ) || '' }}
          build-args: |
            GITHUB_REF
            GITHUB_SHA
          cache-from: type=gha
          cache-to: type=gha
  release-artifacts:
    name: Release Artifacts
    needs:
      [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Upload release assets (.tar.gz, .deb, .zip, .pkg, SHA256SUMS)
        working-directory: release-artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ needs.create-release.outputs.upload_url }}
        run: |
          for f in *; do
            echo "Uploading ${f}"
            curl -sSf -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${f}" \
              "${UPLOAD_URL%\{*}?name=$(printf '%s' "${f}" | jq -sRr @uri)" > /dev/null
          done
